name: Build and Push Docker image

on:
  push:
    branches: [ postgres-rewrite ]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_1 }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Define Docker tags (SemVer tags)
        id: docker_meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME_1 }}/postgres-rewrite
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.label-schema.schema-version=1.0
            org.label-schema.name=postgres-rewrite # 👈 ИЗМЕНЕНО: Указано новое имя образа
            org.label-schema.description=Docker image for postgres-rewrite # 👈 ИЗМЕНЕНО: Указано новое описание образа

      # Шаг для добавления 'latest' ТОЛЬКО для ветки postgres-rewrite
      - name: Add 'latest' tag for postgres-rewrite branch
        if: github.ref == 'refs/heads/postgres-rewrite'
        id: docker_meta_latest
        uses: docker/metadata-action@v4
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME_1 }}/postgres-rewrite
          tags: |
            type=raw,value=latest
          labels: |
            org.label-schema.schema-version=1.0
            org.label-schema.name=postgres-rewrite # 👈 ИЗМЕНЕНО: Указано новое имя образа
            org.label-schema.description=Docker image for postgres-rewrite # 👈 ИЗМЕНЕНО: Указано новое описание образа

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }},${{ steps.docker_meta_latest.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}